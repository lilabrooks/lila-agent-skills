name: Quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          # Pin CI's uv explicitly. Without this the action derives the version
          # from `required-version` in pyproject.toml, which couples the tool
          # CI validates against to a constraint meant for local checkouts.
          version: "0.11.33"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Run repository quality gate
        run: make check
